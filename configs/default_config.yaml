# Default Hyperparameters & Configuration
experiment_name: "baseline_resnet50"
seed: 42

data:
  image_size: 224
  batch_size: 32
  num_workers: 4
  # Local defaults. Override at runtime WITHOUT editing this file by setting:
  #   CANCER_DATASET_DIR    -> overrides dataset_dir
  #   CANCER_MANIFEST_PATH  -> overrides manifest_path
  # On Kaggle the full dataset is mounted read-only, e.g.:
  #   export CANCER_DATASET_DIR=/kaggle/input/cbis-ddsm-breast-cancer-image-dataset
  #   export CANCER_MANIFEST_PATH=/kaggle/working/manifest.csv
  dataset_dir: "data/raw"
  manifest_path: "data/manifest.csv"
  test_split_ratio: 0.15
  val_split_ratio: 0.15

model:
  backbone: "resnet50"   # resnet18 | resnet34 | resnet50 | efficientnet_b0
  pretrained: true
  num_classes: 2
  freeze_layers: false

training:
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.00001
  early_stopping_patience: 5
  checkpoint_dir: "checkpoints"
  device: "auto"          # auto | cpu | cuda
  grad_clip: 1.0          # max grad-norm; null/0 disables clipping
  monitor: "val_loss"     # val_loss (lower better) | val_acc | val_auc (higher better)

  # Class-imbalance handling (CBIS-DDSM is ~59% benign / 41% malignant).
  loss:
    type: "focal"         # focal | bce
    gamma: 2.0            # focal focusing parameter
    alpha: 0.25           # focal positive-class balance (null to disable)
    class_weighting: false # apply pos_weight (num_neg/num_pos) to the loss

  scheduler:
    type: "reduce_on_plateau"  # none | reduce_on_plateau | cosine | step
    factor: 0.5
    patience: 2
    min_lr: 0.000001

evaluation:
  threshold: 0.5        # decision threshold for hard-label metrics
  output_dir: "reports" # reports/<experiment>/<split>/ -> metrics.json + plots
